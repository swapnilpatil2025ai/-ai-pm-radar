name: Update AI PM Radar

on:
  schedule:
    # Mondays and Thursdays, 01:17 UTC = 06:47 IST
    - cron: "17 1 * * 1,4"
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - run: pip install -r requirements-pipeline.txt

      - name: Build new edition
        env:
          PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "No new stories."
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "New edition $(date -u +%Y-%m-%d)"
          git push
